{% extends "base_admin.html" %}

{% block content %}

<style>
  #adminMap {
    height: calc(100vh - 180px);
    width: 100%;
    border-radius: 14px;
  }

  #mapInfoCard {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 320px;
    max-width: 90%;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    padding: 14px;
    display: none;
    z-index: 9999;
    font-size: 13px;
  }

  #mapInfoCard a {
    cursor: pointer;
    text-decoration: underline;
  }
</style>

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-2">
  <div>
    <h5 class="mb-0">🗺 Live Device & Tracking Map</h5>
    <small class="text-muted">Real-time device & driver tracking</small>
  </div>
</div>

<!-- MAP -->
<div class="position-relative">
  <div id="adminMap"></div>

  <!-- INFO CARD -->
  <div id="mapInfoCard">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <strong id="infoTitle">Details</strong>
      <button class="btn-close btn-sm" onclick="closeMapInfo()"></button>
    </div>

    <div><b>Device:</b> <span id="infoDevice">–</span></div>
    <div><b>Status:</b> <span id="infoStatus">–</span></div>
    <div><b>Gas:</b> <span id="infoGas">–</span></div>

    <hr class="my-2">

    <div><b>Driver:</b> <span id="infoDriver">–</span></div>
    <div><b>Task Status:</b> <span id="infoTaskStatus">–</span></div>
    <div>
      <b>Tracking ID:</b>
      <a id="infoTracking" onclick="openTrackingHistory()">–</a>
    </div>
  </div>
</div>

<!-- TRACKING HISTORY MODAL -->
<div class="modal fade" id="trackingModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tracking History</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small" id="trackingHistory">
        Loading…
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block footer %}
<script src="/static/admin/admin_map.js?v=3"></script>
{% endblock %}
